[project]
name = "herobot"
version = "0.1.0"
description = "A minimal Telegram agent bot template."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "mcp>=1.27,<2",
    "openai>=1.93.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.10,<22",
]

[project.scripts]
herobot = "herobot.bot:main"
herobot-multi = "herobot.multi:main"
herobot-mcp-notes = "herobot.mcp.builtin.notes.server:main"
herobot-mcp-calendar = "herobot.mcp.builtin.calendar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herobot"]

[tool.ruff]
line-length = 100
target-version = "py312"
